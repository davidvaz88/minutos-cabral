name: Actualizar calendario FUTGAL Cabral

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Consultar FUTGAL
        run: python scripts/actualizar_calendario.py

      - name: Publicar calendario si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar calendario oficial Cabral"
            git push
          fi
